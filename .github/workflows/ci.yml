name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Wesal.slnx

      - name: Build
        run: dotnet build Wesal.slnx --configuration Release --no-restore

      - name: Upload test build output
        uses: actions/upload-artifact@v4
        with:
          name: test-binaries
          path: tests/Wesal.Tests/bin/Release
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download test build output
        uses: actions/download-artifact@v4
        with:
          name: test-binaries
          path: tests/Wesal.Tests/bin/Release

      - name: Run tests
        run: dotnet test Wesal.slnx --configuration Release --no-build --no-restore